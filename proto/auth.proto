syntax = "proto3";
package enrollment.auth;
option java_multiple_files = true;
option java_package = "enrollment.auth";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}
message LoginRequest  { string username = 1; string password = 2; }
message LoginResponse { string token = 1; string username = 2; string full_name = 3; string role = 4; int64 expires_at = 5; }
message LogoutRequest { string token = 1; }
message LogoutResponse {}